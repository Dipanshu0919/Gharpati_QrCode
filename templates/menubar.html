<!doctype html>
<html lang="mr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}घरपट्टी व्यवस्थापन{% endblock %}</title>
  <style>
    :root {
      --border: #dfe4ec;
      --text: #1d2433;
      --muted: #5f697a;
      --surface: #ffffff;
      --surface-alt: #f8fbff;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      --primary: #1f4b99;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #eef4fb;
      color: var(--text);
      line-height: 1.5;
    }
    .page {
      display: flex;
      min-height: 100vh;
      width: 100%;
      background: #eef4fb;
    }
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 52px;
      min-width: 52px;
      padding: 16px 6px;
      border-right: 1px solid #dfe4ec;
      background: #f7f9fc;
      transition: width 0.3s ease, min-width 0.3s ease, padding 0.3s ease;
      overflow: hidden;
      flex-shrink: 0;
      z-index: 110;
    }
    .sidebar:hover {
      width: 156px;
      min-width: 156px;
      padding: 16px 12px;
    }
    .sidebar .nav-text { display: none; text-align: left; flex: 1; line-height: 20px; white-space: nowrap; }
    .sidebar:hover .nav-text { display: inline-block; }
    .sidebar .nav-item { justify-content: center; padding: 10px 0; }
    .sidebar:hover .nav-item { justify-content: flex-start; padding: 10px 6px; gap: 6px; }
    .icon { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex: 0 0 20px; }
    .icon svg { width: 18px; height: 18px; display: block; stroke: currentColor; }
    .sidebar nav { display: flex; flex-direction: column; gap: 8px; }
    .nav-item {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      min-height: 40px;
      padding: 10px 6px;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      border: 1px solid transparent;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .nav-item:hover,
    .nav-item.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .main-content { flex: 1; padding: 0; min-width: 0; }
    .header {
      padding: 18px 22px 10px;
      border-bottom: 1px solid #eceff4;
      background: var(--surface);
    }
    .header h1 {
      margin: 0;
      font-size: clamp(1.85rem, 2.3vw, 2.5rem);
      line-height: 1.1;
      color: #14213d;
    }
    .header p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
      max-width: 42rem;
    }
    .content {
      padding: 18px 22px 24px;
    }
    .service-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .service-tabs button {
      border: 1px solid #d1d5db;
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      background: #fff;
      color: #0f172a;
      font-weight: 700;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .service-tabs button.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .request-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid #dfe4ec;
      border-radius: 18px;
      overflow: hidden;
    }
    .request-table th,
    .request-table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
      vertical-align: middle;
    }
    .request-table th {
      background: #f8fbff;
      font-weight: 700;
      color: #0f172a;
    }
    .request-table tr:last-child td { border-bottom: none; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .status-pending { background: #fffaeb; color: #b45309; border: 1px solid #fde68a; }
    .status-approved { background: #ecfdf5; color: #166534; border: 1px solid #bbf7d0; }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #153775; }
    .btn-danger { background: var(--danger); color: #fff; }
    @media (max-width: 780px) {
      .sidebar { width: 52px; min-width: 52px; }
      .sidebar:hover { width: 140px; min-width: 140px; }
      .content { padding: 16px; }
      .request-table th,
      .request-table td { padding: 12px 10px; }
    }
    {% block extra_styles %}{% endblock %}

    .page {
      display: flex;
      min-height: 100vh;
      width: 100%;
      background: #eef4fb;
    }
    .page > .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 52px;
      min-width: 52px;
      padding: 16px 6px;
      border-right: 1px solid #dfe4ec;
      background: #f7f9fc;
      transition: width 0.3s ease, min-width 0.3s ease, padding 0.3s ease;
      overflow: hidden;
      flex-shrink: 0;
      z-index: 110;
    }
    .page > .sidebar:hover {
      width: 156px;
      min-width: 156px;
      padding: 16px 10px;
    }
    .page > .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .page > .sidebar .nav-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
      min-height: 40px;
      padding: 10px 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      line-height: 20px;
      border: 1px solid transparent;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .page > .sidebar:hover .nav-item {
      justify-content: flex-start;
      gap: 6px;
      padding: 10px 6px;
    }
    .page > .sidebar .nav-item:hover,
    .page > .sidebar .nav-item.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .page > .sidebar .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
    }
    .page > .sidebar .icon svg {
      width: 18px;
      height: 18px;
      display: block;
      stroke: currentColor;
    }
    .page > .sidebar .nav-text {
      display: none;
      flex: 1;
      text-align: left;
      line-height: 20px;
      white-space: nowrap;
    }
    .page > .sidebar:hover .nav-text {
      display: inline-block;
    }
    .main-content {
      flex: 1;
      padding: 0;
      min-width: 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <nav>
        <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 11.5 12 4l9 7.5"></path>
              <path d="M5 10.5V20h14v-9.5"></path>
              <path d="M9 20v-6h6v6"></path>
            </svg>
          </span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="{{ url_for('reports') }}" class="nav-item {% if request.endpoint == 'reports' %}active{% endif %}">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19V5"></path>
              <path d="M4 19h16"></path>
              <path d="M8 16v-5"></path>
              <path d="M12 16V8"></path>
              <path d="M16 16v-9"></path>
            </svg>
          </span>
          <span class="nav-text">Reports</span>
        </a>
        <a href="{{ url_for('services') }}" class="nav-item {% if request.endpoint == 'services' %}active{% endif %}">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a4 4 0 0 0-5 5L4 17v3h3l5.7-5.7a4 4 0 0 0 5-5l-2.8 2.8-3-3 2.8-2.8Z"></path>
            </svg>
          </span>
          <span class="nav-text">Services</span>
        </a>
        <a href="{{ url_for('generateqr') }}" class="nav-item {% if request.endpoint == 'generateqr' %}active{% endif %}">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h6v6H4z"></path>
              <path d="M14 4h6v6h-6z"></path>
              <path d="M4 14h6v6H4z"></path>
              <path d="M14 14h2"></path>
              <path d="M20 14v2"></path>
              <path d="M16 18h4v2"></path>
            </svg>
          </span>
          <span class="nav-text">Generate QR</span>
        </a>
        <a href="{{ url_for('admin_page') }}" class="nav-item {% if request.endpoint == 'admin_page' %}active{% endif %}">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 2v3"></path>
              <path d="M12 19v3"></path>
              <path d="M2 12h3"></path>
              <path d="M19 12h3"></path>
              <path d="m4.9 4.9 2.1 2.1"></path>
              <path d="m17 17 2.1 2.1"></path>
              <path d="m19.1 4.9-2.1 2.1"></path>
              <path d="m7 17-2.1 2.1"></path>
            </svg>
          </span>
          <span class="nav-text">Admin</span>
        </a>
        <a href="{{ url_for('logout') }}" class="nav-item" style="margin-top: auto; color: #ef4444;" onclick="return confirm('प्रशासक पॅनेलमधून बाहेर पडायचे आहे का?');">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="11" width="14" height="10" rx="2"></rect>
              <path d="M8 11V8a4 4 0 0 1 7.6-1.8"></path>
              <path d="M12 15v2"></path>
            </svg>
          </span>
          <span class="nav-text">Logout</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="header">
        <h1>{% block page_title %}पेज शीर्षक{% endblock %}</h1>
        <p>{% block page_description %}{% endblock %}</p>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
